services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-northstar}
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
    ports:
      - "5432:5432"
    volumes:
      - northstar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-northstar} -d ${POSTGRES_DB:-northstar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  northstar_postgres:

